<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NUEVA YORK">
<title>NUEVA YORK · Sonidero Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#0E2E7A; --grape:#0A2560; --paper:#F5E9CC; --paper2:#EAD6A0;
    --pink:#FF2E9A; --turq:#17C3E6; --gold:#FFD21E; --tang:#FF7A1A;
    --violet:#7A3FF2; --blue:#1E8FE0; --lime:#159A5B; --amber:#FB8500; --red:#E4231A;
    --line:rgba(245,233,204,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif;color:var(--paper);
    background:var(--ink);
    background-image:
      radial-gradient(circle at 50% -8%, rgba(255,210,30,.20), transparent 46%),
      radial-gradient(circle at 10% 14%, rgba(228,35,26,.16), transparent 42%),
      radial-gradient(circle at 92% 20%, rgba(23,195,230,.16), transparent 46%),
      linear-gradient(180deg,#123FA6,#0E2E7A 55%,#0A2560);
    background-attachment:fixed;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1180px;margin:0 auto;position:relative}

  /* ---------- HEADER ---------- */
  header{
    padding:calc(env(safe-area-inset-top) + 8px) 16px 7px;
    background:
      repeating-linear-gradient(45deg, rgba(255,210,30,.07) 0 12px, transparent 12px 24px),
      linear-gradient(180deg,#0A2560,#0E2E7A);
    border-bottom:4px solid var(--gold);
    position:relative;overflow:hidden;flex:0 0 auto;
  }
  header::before{ /* starburst */
    content:"";position:absolute;top:-60px;right:-40px;width:190px;height:190px;
    background:conic-gradient(from 0deg,
      var(--gold) 0 15deg, transparent 15deg 30deg, var(--red) 30deg 45deg, transparent 45deg 60deg,
      var(--tang) 60deg 75deg, transparent 75deg 90deg, var(--turq) 90deg 105deg, transparent 105deg 120deg,
      var(--gold) 120deg 135deg, transparent 135deg 150deg, var(--red) 150deg 165deg, transparent 165deg 180deg,
      var(--tang) 180deg 195deg, transparent 195deg 210deg, var(--turq) 210deg 225deg, transparent 225deg 240deg,
      var(--gold) 240deg 255deg, transparent 255deg 270deg, var(--red) 270deg 285deg, transparent 285deg 300deg,
      var(--tang) 300deg 315deg, transparent 315deg 330deg, var(--turq) 330deg 345deg, transparent 345deg 360deg);
    opacity:.32;border-radius:50%;filter:blur(.3px);pointer-events:none;
  }
  .kicker{font-family:'Chango';font-size:9px;letter-spacing:2px;color:var(--turq);text-transform:uppercase;position:relative}
  h1{
    font-family:'Chango',system-ui;font-weight:400;margin:3px 0 0;line-height:.9;
    font-size:clamp(30px,9vw,48px);letter-spacing:1px;position:relative;text-transform:uppercase;
    color:var(--red);-webkit-text-stroke:2px var(--gold);paint-order:stroke fill;
    text-shadow:0 0 4px var(--tang), 0 0 12px rgba(255,176,30,.85), 0 0 22px rgba(255,210,30,.55), 4px 5px 0 #7A0D06;
  }
  h1 span{display:block;font-family:'DM Sans',sans-serif;font-weight:700;font-size:11px;color:var(--paper);
    -webkit-text-stroke:0;text-shadow:1px 1px 0 rgba(0,0,0,.4);letter-spacing:3px;margin-top:5px;text-transform:uppercase}
  .tagline{font-size:11.5px;color:var(--paper2);margin-top:4px;position:relative;font-weight:500}

  /* ---------- SEARCH + TABS ---------- */
  .toolbar{display:flex;gap:8px;margin-top:8px;position:relative}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(251,233,208,.10);
    border:2px solid var(--line);border-radius:40px;padding:6px 12px}
  .search input{flex:1;background:none;border:0;color:var(--paper);font-size:14px;font-family:inherit;outline:none}
  .search input::placeholder{color:rgba(251,233,208,.5)}
  .search svg{flex:0 0 auto}

  .tabs{display:flex;gap:5px;padding:6px 16px 0;position:relative;flex:0 0 auto;background:linear-gradient(180deg,#0A2560,transparent)}
  .tab{flex:1;font-family:'Chango';font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    padding:7px 5px;border-radius:10px 10px 0 0;border:2px solid var(--line);border-bottom:0;
    background:rgba(251,233,208,.06);color:var(--paper2);cursor:pointer;transition:.15s}
  .tab.on{background:var(--gold);color:#0A2560}
  .tab:focus-visible{outline:3px solid var(--turq);outline-offset:2px}

  /* ---------- FILTER CHIPS ---------- */
  .filters{padding:6px 0 5px;flex:0 0 auto;border-top:2px solid var(--line);background:rgba(10,37,96,.6)}
  .chiprow{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:40px;
    border:2px solid var(--c,var(--paper2));color:var(--paper);background:transparent;cursor:pointer;
    white-space:nowrap;display:flex;align-items:center;gap:5px;transition:.12s}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#fff)}
  .chip.on{background:var(--c,var(--gold));color:#0A2560}
  .chip.on .dot{background:#0A2560}
  .chip:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
  .hoodrow{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 0;scrollbar-width:none}
  .hoodrow::-webkit-scrollbar{display:none}
  .boro{flex:0 0 auto;font-family:'Chango';font-size:9px;letter-spacing:.5px;text-transform:uppercase;
    padding:5px 9px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--paper2);cursor:pointer}
  .boro.on{background:var(--pink);color:#0A2560;border-color:var(--pink)}
  .favbtn{border-color:var(--gold);color:var(--gold)}
  .favbtn.on{background:var(--gold);color:#0A2560;border-color:var(--gold)}
  .openbtn{border-color:#3FD98A;color:#3FD98A}
  .openbtn.on{background:#3FD98A;color:#08201f;border-color:#3FD98A}
  .count{font-size:10.5px;color:var(--paper2);padding:4px 16px 0;font-weight:500}

  /* ---------- PANELS ---------- */
  .panel{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
  .view{position:absolute;inset:0;display:none}
  .view.on{display:block}
  #map{width:100%;height:100%;background:#0A2560}
  .listwrap{position:absolute;inset:0;overflow-y:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
  .cards{display:grid;grid-template-columns:1fr;gap:11px}
  @media(min-width:560px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--paper);color:#12245E;border-radius:16px;padding:14px 14px 12px;position:relative;
    box-shadow:5px 5px 0 rgba(0,0,0,.35);border:2px solid #12245E;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;width:100%;height:7px;background:var(--c,var(--pink))}
  .card .catline{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--c);margin-top:2px}
  .card h3{font-family:'Chango';font-weight:400;font-size:20px;line-height:1;margin:6px 0 2px;letter-spacing:.4px}
  .card .hood{font-size:12px;color:#6a5a44;font-weight:700;margin-bottom:6px}
  .card p{font-size:13px;line-height:1.35;margin:0 0 10px;color:#3a2b1c}
  .card .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font-family:'Chango';font-size:10px;letter-spacing:.3px;text-transform:uppercase;text-decoration:none;
    padding:8px 12px;border-radius:9px;border:2px solid #12245E;color:#12245E;background:var(--gold);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .btn.ghost{background:transparent}
  .btn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  .fav{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;line-height:1;color:#c9b48f}
  .fav.on{color:var(--pink)}
  .empty{text-align:center;padding:60px 24px;color:var(--paper2)}
  .empty b{font-family:'Chango';font-size:24px;display:block;color:var(--paper);margin-bottom:6px}

  /* ---------- DAY TRIP ---------- */
  .day{position:absolute;inset:0;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 30px)}
  .daycard{background:rgba(251,233,208,.07);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .daycard h2{font-family:'Chango';font-size:14px;margin:0 0 4px;color:var(--gold);letter-spacing:.5px}
  .daycard p.help{font-size:12.5px;color:var(--paper2);margin:0 0 12px}
  label.fld{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--turq);margin:10px 0 5px}
  .pillrow{display:flex;flex-wrap:wrap;gap:7px}
  .pill{font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:40px;border:2px solid var(--line);background:transparent;color:var(--paper);cursor:pointer}
  .pill.on{background:var(--turq);color:#08201f;border-color:var(--turq)}
  .go{width:100%;margin-top:16px;font-family:'Chango';font-size:14px;letter-spacing:1px;text-transform:uppercase;
    padding:15px;border-radius:14px;border:3px solid #0A2560;color:#0A2560;
    background:linear-gradient(92deg,var(--red),var(--tang),var(--gold));cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
  .go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.4)}
  .go.alt{margin-top:9px;background:linear-gradient(92deg,var(--turq),#5BD9F5)}
  .go[disabled]{opacity:.6;cursor:default}
  .stop{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .stop:last-child{border-bottom:0}
  .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--c,var(--pink));color:#0A2560;
    font-family:'Chango';font-size:15px;display:grid;place-items:center}
  .stop .info h4{font-family:'Chango';font-weight:400;font-size:18px;margin:2px 0 1px;letter-spacing:.3px}
  .stop .info .meta{font-size:11.5px;color:var(--paper2);font-weight:600}
  .stop .info p{font-size:12.5px;margin:5px 0 0;color:var(--paper)}
  .etaline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--turq)}
  /* ---------- MUSTS / TO-DO ---------- */
  .tally{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:var(--paper2);letter-spacing:0}
  .todolist{margin-top:4px;border-top:1px solid var(--line)}
  .todo{display:flex;gap:9px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
  .todo .info{flex:1;min-width:0}
  .todo .info h4{font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;margin:0;letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .todo .info .meta{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden;
    font-size:11px;color:var(--paper2);font-weight:600;margin-top:1px;white-space:nowrap}
  .todo .info .meta .mt{overflow:hidden;text-overflow:ellipsis}
  .todo .hb{flex:0 0 auto;font-size:9.5px;padding:2px 6px}
  .todo.is-done{opacity:.45}
  .todo.is-done .info h4{text-decoration:line-through}
  .chk{flex:0 0 auto;width:22px;height:22px;border-radius:6px;cursor:pointer;
    border:2px solid var(--line);background:transparent;color:#08201f;font-size:13px;font-weight:700;line-height:1}
  .chk.on{background:#3FD98A;border-color:#3FD98A}
  .chk:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
  /* weekend-at-a-glance rows */
  .wkrow{padding:8px 2px;border-bottom:1px solid var(--line)}
  .wkrow:last-child{border-bottom:0}
  .wkn{font-size:13.5px;font-weight:700;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wkh{font-weight:600;color:var(--paper2);font-size:11px}
  .wkdays{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .wkd{flex:1 1 132px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .wkd b{font-family:'Chango';font-weight:400;font-size:9.5px;letter-spacing:.4px;margin-right:3px}
  .wkd.open{background:rgba(21,154,91,.16);color:#3FD98A}
  .wkd.closed{background:rgba(228,35,26,.16);color:#FF7A72}
  .wkd.unknown{background:rgba(245,233,204,.10);color:var(--paper2)}
  .warn{background:rgba(255,122,26,.14);border:2px solid rgba(255,164,92,.45);border-radius:12px;
    padding:9px 11px;font-size:12px;line-height:1.4;color:#FFC79A;margin:2px 0 10px}
  .warn b{color:#FFA45C}
  .tgo{flex:0 0 auto;text-decoration:none;color:var(--gold);font-size:14px;font-weight:700;padding:2px 3px}
  .todo .del{flex:0 0 auto;width:24px;height:24px;color:var(--pink);border-color:var(--line);font-size:12px;margin:0}
  .todo .del:active{background:var(--pink);border-color:var(--pink);color:#0A2560}
  .routebtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .inp{width:100%;font-family:inherit;font-size:15px;color:#12245E;background:var(--paper);border:2px solid #12245E;border-radius:10px;padding:11px 12px;margin-top:2px}
  .inp::placeholder{color:#8a7a5f}
  select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#12245E 50%),linear-gradient(135deg,#12245E 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .opt{font-weight:400;color:var(--paper2);text-transform:none;letter-spacing:0;font-size:10px}
  .fmsg{font-size:12.5px;margin-top:10px;color:var(--gold);min-height:16px;font-weight:600}
  .pickres{margin-top:8px;max-height:210px;overflow-y:auto;border:2px solid var(--line);border-radius:12px}
  .pickres:empty{display:none}
  .pr{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;background:none;
    border:0;border-bottom:1px dashed var(--line);color:var(--paper);font-family:inherit;font-size:13px;cursor:pointer}
  .pr:last-child{border-bottom:0}
  .pr:hover,.pr:focus-visible{background:rgba(251,233,208,.09);outline:none}
  .pr i{width:9px;height:9px;border-radius:50%;background:var(--c,#fff);flex:0 0 auto}
  .pr .prm{font-size:11px;color:var(--paper2);font-weight:600}
  .pr[disabled]{opacity:.45;cursor:default}
  /* ---------- HOURS BADGES ---------- */
  .hb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;
    border-radius:40px;white-space:nowrap;letter-spacing:.2px}
  .hb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .hb.ho{background:rgba(21,154,91,.16);color:#3FD98A}
  .hb.hs{background:rgba(255,122,26,.18);color:#FFA45C}
  .hb.hc{background:rgba(228,35,26,.16);color:#FF7A72}
  .hb.hu{background:rgba(245,233,204,.12);color:var(--paper2)}
  .card .hb{margin-bottom:8px}
  .card .hb.ho{background:rgba(21,154,91,.15);color:#0F7A45}
  .card .hb.hs{background:rgba(255,122,26,.17);color:#B4510A}
  .card .hb.hc{background:rgba(228,35,26,.13);color:#B01810}
  .card .hb.hu{background:rgba(18,36,94,.09);color:#6a5a44}
  .pop .hb{margin:2px 0 4px}
  .pop .hb.ho{background:rgba(21,154,91,.15);color:#0F7A45}
  .pop .hb.hs{background:rgba(255,122,26,.17);color:#B4510A}
  .pop .hb.hc{background:rgba(228,35,26,.13);color:#B01810}
  .pop .hb.hu{background:rgba(18,36,94,.09);color:#6a5a44}
  .del{margin-left:auto;background:none;border:2px solid var(--line);color:var(--paper);border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;flex:0 0 auto}
  .del:active{background:var(--red);border-color:var(--red)}

  /* ---------- LEAFLET MARKERS / POPUP ---------- */
  .pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2.5px solid #0A2560;box-shadow:1px 2px 3px rgba(0,0,0,.4)}
  .pin.fav{box-shadow:0 0 0 3px var(--pink),1px 2px 3px rgba(0,0,0,.4)}
  .leaflet-popup-content-wrapper{background:var(--paper);color:#12245E;border-radius:14px;border:2px solid #12245E;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
  .leaflet-popup-tip{background:var(--paper);border:2px solid #12245E}
  .pop .pc{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--c)}
  .pop h3{font-family:'Chango';font-weight:400;font-size:19px;margin:3px 0 1px}
  .pop .ph{font-size:11.5px;color:#6a5a44;font-weight:700}
  .pop p{font-size:12.5px;margin:6px 0 8px;color:#3a2b1c;max-width:210px}
  .pop a{font-family:'Chango';font-size:10px;text-transform:uppercase;text-decoration:none;color:#12245E;background:var(--gold);border:2px solid #12245E;padding:6px 10px;border-radius:8px;display:inline-block}
  .popbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .popfav{font-family:'Chango';font-size:10px;text-transform:uppercase;color:#12245E;background:transparent;
    border:2px solid #12245E;padding:6px 9px;border-radius:8px;cursor:pointer;line-height:1}
  .popfav.on{background:var(--pink);color:#fff;border-color:#12245E}
  .leaflet-control-attribution{font-size:9px}
  .legend{position:absolute;left:10px;bottom:14px;background:rgba(10,37,96,.9);border:2px solid var(--line);border-radius:12px;padding:7px 9px;font-size:9.5px;z-index:500;max-width:140px;cursor:pointer}
  .legend b{font-family:'Chango';font-size:8.5px;letter-spacing:.5px;display:block;color:var(--gold)}
  .legend .lg{display:flex;align-items:center;gap:5px;margin:2px 0;font-weight:600}
  .legend .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .legend.min .lg{display:none}
  .legend.min b{margin:0}
  .leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:21px!important}
  .locbtn{position:absolute;right:12px;top:12px;z-index:600;font-family:'Chango';font-size:12px;
    background:var(--turq);color:#08201f;border:2px solid #0A2560;border-radius:40px;padding:9px 14px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
  .locbtn:active{transform:translate(1px,1px)}
  .medot{width:16px;height:16px;border-radius:50%;background:#17C3E6;border:3px solid #fff;box-shadow:0 0 0 2px #17C3E6;animation:mepulse 2s infinite}
  @keyframes mepulse{0%{box-shadow:0 0 0 2px #17C3E6,0 0 0 0 rgba(23,195,230,.55)}70%{box-shadow:0 0 0 2px #17C3E6,0 0 0 15px rgba(23,195,230,0)}100%{box-shadow:0 0 0 2px #17C3E6,0 0 0 0 rgba(23,195,230,0)}}
  .credit{display:inline-block;margin-top:9px;font-size:11px;color:var(--gold);text-decoration:none;font-weight:700;position:relative;border-bottom:1px dotted var(--gold)}
  .credit:active{opacity:.7}

  @media (max-width:600px){
    header{padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:6px}
    h1{font-size:clamp(24px,8vw,34px);line-height:.9}
    h1 span{font-size:9px;letter-spacing:2px;margin-top:4px}
    .tagline{display:none}
    .kicker{font-size:8px}
    .toolbar{margin-top:6px}
    .search{padding:5px 11px}
    .credit{margin-top:6px;font-size:10px}
    .tabs{padding:5px 12px 0}
    .tab{padding:6px 4px;font-size:9px}
    .filters{padding:5px 0 4px}
    .chiprow{padding:0 12px 2px}
    .hoodrow{padding:5px 12px 0}
    .count{padding:3px 12px 0}
    .chip{padding:5px 9px;font-size:11px}
    .leaflet-control-zoom a{width:34px!important;height:34px!important;line-height:34px!important;font-size:20px!important}
    .locbtn{top:10px;right:10px}
    .legend{left:8px;bottom:10px;font-size:10px;padding:8px 9px}
  }
  @media (max-width:600px) and (max-height:720px){
    .legend{display:none}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ============ OPENING HOURS ============
   p.hrs is 7 entries, index 0 = Sunday. null = closed that day.
   "HH:MM-HH:MM", comma-separated for split shifts; a close <= open crosses midnight.
   No hrs key at all = hours unknown — never treated as closed. */
const MINS=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const HHMM=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
function dayRanges(p,dow){
  if(!p.hrs) return null;
  const s=p.hrs[dow];
  if(!s) return [];
  return s.split(',').map(r=>{
    const[a,b]=r.split('-');
    let o=MINS(a),c=MINS(b);
    if(c<=o) c+=1440;               // e.g. 18:00-02:00
    return [o,c];
  });
}
/* state: 'unknown' | 'open' | 'closed'; when open, closesIn minutes; when closed, opensAt today */
function openInfo(p,when){
  if(!p.hrs) return {state:'unknown'};
  const dow=when.getDay(), now=when.getHours()*60+when.getMinutes();
  const today=dayRanges(p,dow)||[];
  const spill=(dayRanges(p,(dow+6)%7)||[]).filter(r=>r[1]>1440).map(r=>[r[0]-1440,r[1]-1440]);
  for(const[o,c]of today.concat(spill)) if(now>=o&&now<c) return {state:'open',closesIn:c-now,closeAt:c,allDay:o===0&&c===1440};
  const later=today.filter(r=>r[0]>now).sort((a,b)=>a[0]-b[0]);
  return {state:'closed',opensAt:later.length?later[0][0]:null};
}
const SOON=60;                       // minutes that count as "closing soon"
function hoursLabel(p,when){
  const i=openInfo(p,when);
  if(i.state==='unknown') return {cls:'hu',txt:'Hours unknown'};
  if(i.state==='open'){
    if(i.allDay) return {cls:'ho',txt:'Open 24h'};
    return i.closesIn<=SOON
      ? {cls:'hs',txt:`Closes in ${i.closesIn} min`}
      : {cls:'ho',txt:`Open till ${HHMM(i.closeAt)}`};
  }
  return {cls:'hc',txt:i.opensAt!==null?`Closed · opens ${HHMM(i.opensAt)}`:'Closed today'};
}

}
function saveSet(key,set){ try{ localStorage.setItem(key,JSON.stringify([...set])); }catch(e){} }

/* ============ SEARCH ============
   Every spot carries bilingual keywords in p.k; the category adds its own synonyms,
   and both sides of a comparison are stripped of accents so "cafe" finds "Café"
   and "zapateria" finds "Zapatería". */
const CATKW={
  vintage:"vintage ropa segunda mano thrift secondhand usada moda fashion clothes",
  food:"comida restaurante restaurant comer eat food cena dinner almuerzo lunch",
  cafe:"cafe cafeteria coffee bakery panaderia pasteleria desayuno breakfast",
  drinks:"bar bares copas drinks musica music live nightlife noche night",
  vinyl:"vinilo vinilos discos records record store tienda de discos musica music lp tocadiscos",
  shops:"tienda tiendas shop store curiosidades curiosities regalos gifts",
  art:"arte art museo museum galeria gallery exposicion exhibition cultura culture",
  market:"mercadillo mercado rastro flea market puestos stalls antiguedades antiques",
  green:"parque park jardin garden verde green naturaleza nature",
  arch:"edificio edificios building buildings arquitectura architecture landmark monumento rascacielos skyscraper"
};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const haystack=p=>norm([p.n,p.h,BOROS[p.b]||'',CAT[p.c]?CAT[p.c].label:'',p.bl,p.k||'',CATKW[p.c]||''].join(' '));

/* ============ FILTER LOGIC ============ */
function match(p){
  if(state.onlyFavs && !state.favs.has(p.n)) return false;
  // unknown hours are never hidden — we only drop what we know is shut
  if(state.onlyOpen && openInfo(p,new Date()).state==='closed') return false;
  if(state.cats.size && !state.cats.has(p.c)) return false;
  if(state.boro!=="ALL" && p.b!==state.boro) return false;
  if(state.q){ if(!haystack(p).includes(state.q)) return false; }
  return true;
}

const pinIcon=p=>L.divIcon({className:'',html:`<div class="pin ${state.favs.has(p.n)?'fav':''}" style="background:${CAT[p.c].c}"></div>`,iconSize:[20,20],iconAnchor:[10,18],popupAnchor:[0,-16]});
const favBtnHtml=p=>{const on=state.favs.has(p.n);
  return `<button class="popfav ${on?'on':''}" data-favpop="${esc(p.n)}">${on?'♥ Must':'♡ Add to musts'}</button>`;};
function popupHtml(p){
  const hb=p.c==='arch'?'':(l=>`<div class="hb ${l.cls}">${l.txt}</div>`)(hoursLabel(p,new Date()));
  return `<div class="pop" style="--c:${CAT[p.c].c}"><div class="pc">${CAT[p.c].e} ${CAT[p.c].label}</div>`+
    `<h3>${p.n}</h3><div class="ph">${p.h} · ${BOROS[p.b]}</div>${hb}<p>${p.bl}</p>`+
    `<div class="popbtns"><a href="${gmap(p)}" target="_blank" rel="noopener">Open in Maps ↗</a>${favBtnHtml(p)}</div></div>`;
}
function drawMarkers(){
  if(!map) return;
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  DATA.filter(match).forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(p)}).addTo(map);
    m._spot=p;
    m.bindPopup(popupHtml(p));
    markers.push(m);
  });
}
/* Heart straight from the popup. Re-rendering every marker would slam the popup
   shut, so only the one pin and the open popup are refreshed in place. */
if(map) map.on('popupopen',e=>{
  const el=e.popup.getElement(); if(!el) return;
  const btn=el.querySelector('[data-favpop]'); if(!btn) return;
  btn.onclick=()=>{
    const mk=e.popup._source, p=mk&&mk._spot;
    toggleFav(btn.dataset.favpop);
    const on=state.favs.has(btn.dataset.favpop);

    btn.textContent=on?'♥ Must':'♡ Add to musts';
    if(mk&&p) mk.setIcon(pinIcon(p));

});

/* ============ DAY TRIP GENERATOR ============ */
const dayState={vibe:"mix",area:"ALL",picks:[],me:null,openOnly:true};
const WALK_KMH=4.5, DWELL_MIN=35;          // strolling pace + time spent at each stop
const walkMin=(a,b)=>haversine(a,b)/WALK_KMH*60;
const clockTxt=d=>HHMM(d.getHours()*60+d.getMinutes());
function haversine(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,
  s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));}
const VIBES={
  mix:{label:"Mixed Bag",cats:null},
  vintage:{label:"Vintage Crawl",cats:["vintage","market"]},
  food:{label:"Eat Your Way",cats:["food","cafe"]},
  art:{label:"Art & Coffee",cats:["art","cafe"]},
  night:{label:"Bars & Music",cats:["drinks","food"]},
  arch:{label:"Architecture Walk",cats:["arch","art"]}
};

/* ---- Plan around where you are right now ---- */
function planFromMe(){
  const btn=document.getElementById('gome'), msg=document.getElementById('gomsg');
  if(!navigator.geolocation){ msg.textContent='Location is not available on this device.'; return; }
  btn.disabled=true; btn.textContent='◎ Finding you…'; msg.textContent='';
  navigator.geolocation.getCurrentPosition(pos=>{
    dayState.me={lat:pos.coords.latitude,lng:pos.coords.longitude};
    btn.disabled=false; btn.textContent='◎ Plan around my location';
    planDay(true);
  },err=>{
    btn.disabled=false; btn.textContent='◎ Plan around my location';
    msg.textContent='Could not get your location — allow location access for this site, or use “Plan my day”.';
  },{enableHighAccuracy:true,timeout:9000,maximumAge:60000});
}

/* ---- My day: search to add, ✕ to remove ---- */
function drawPickResults(q){
  const box=document.getElementById('pickres'); if(!box) return;
  if(!q){ box.innerHTML=''; return; }
  const hits=DATA.filter(p=>(p.n+' '+p.h+' '+(CAT[p.c]?CAT[p.c].label:'')).toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){ box.innerHTML='<button class="pr" disabled>No match — try another name.</button>'; return; }
  box.innerHTML=hits.map(p=>{
    const v=CAT[p.c]||{c:'#999',e:'📍',label:'—'}, on=dayState.picks.some(x=>x.n===p.n);
    const l=p.c==='arch'?null:hoursLabel(p,new Date());
    return `<button class="pr" style="--c:${v.c}" data-n="${esc(p.n).replace(/"/g,'&quot;')}" ${on?'disabled':''}>
      <i></i><div>${esc(p.n)}<div class="prm">${v.e} ${v.label} · ${esc(p.h)}${l?` · <span class="hb ${l.cls}">${l.txt}</span>`:''}</div></div>
      <div style="margin-left:auto;font-weight:700">${on?'✓':'＋'}</div></button>`;
  }).join('');
  box.querySelectorAll('.pr[data-n]').forEach(b=>b.onclick=()=>{
    const p=DATA.find(x=>x.n===b.dataset.n);
    if(p && !dayState.picks.some(x=>x.n===p.n)){ dayState.picks.push(p); renderMyDay(); }
    const inp=document.getElementById('pickq'); if(inp){ inp.value=''; }
    document.getElementById('pickres').innerHTML='';
  });
}
function renderMyDay(){
  const box=document.getElementById('mydaylist'); if(!box) return;
  const picks=dayState.picks;
  if(!picks.length){ box.innerHTML='<p class="help" style="margin:14px 0 0">Nothing picked yet.</p>'; return; }
  let dist=0; for(let i=1;i<picks.length;i++) dist+=haversine(picks[i-1],picks[i]);
  const wp=picks.map(p=>`${p.lat},${p.lng}`);
  const routeUrl=`https://www.google.com/maps/dir/?api=1&origin=${wp[0]}&destination=${wp[wp.length-1]}&travelmode=walking${wp.length>2?`&waypoints=${wp.slice(1,-1).join('|')}`:''}`;
  // same clock model as the generator: leave now, walk, spend a while at each stop
  let clk=new Date();
  const etas=picks.map((p,i)=>{
    if(i) clk=new Date(clk.getTime()+(DWELL_MIN+walkMin(picks[i-1],p))*60000);
    return new Date(clk);
  });
  const shut=picks.filter((p,i)=>p.c!=='arch'&&openInfo(p,etas[i]).state==='closed').length;
  box.innerHTML=`<p class="help" style="margin:14px 0 4px">${picks.length} stop${picks.length!==1?'s':''}${picks.length>1?` · about ${dist.toFixed(1)} km on foot`:''}.${shut?` <b style="color:#FF7A72">${shut} would be shut when you'd arrive.</b>`:''}</p>`+
    picks.map((p,i)=>{const v=CAT[p.c]||{c:'#999',e:'📍',label:'—'};const l=hoursLabel(p,etas[i]);
      return `<div class="stop"><div class="num" style="--c:${v.c}">${i+1}</div>
        <div class="info"><h4>${esc(p.n)}</h4><div class="meta">${v.e} ${v.label} · ${esc(p.h)}</div>
        <div class="etaline">~${clockTxt(etas[i])}${p.c==='arch'?'':` <span class="hb ${l.cls}">${l.txt}</span>`}</div></div>
        <button class="del" data-i="${i}" aria-label="Remove ${esc(p.n)}">✕</button></div>`;}).join('')+
    `<div class="routebtns">
       ${picks.length>1?`<a class="btn" href="${routeUrl}" target="_blank" rel="noopener">Open route in Google Maps ↗</a>`:''}
       <button class="btn ghost" id="clearday">↺ Clear</button>
     </div>`;
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ picks.splice(+b.dataset.i,1); renderMyDay(); });
  const c=box.querySelector('#clearday'); if(c) c.onclick=()=>{ dayState.picks=[]; renderMyDay(); };
}
function planDay(useMe){
  const me = useMe ? dayState.me : null;
  let pool=DATA.filter(p=>{
    // when planning from your location, proximity replaces the borough filter
    if(!me && dayState.area!=="ALL" && p.b!==dayState.area) return false;
    const cats=VIBES[dayState.vibe].cats;
    if(cats && !cats.includes(p.c)) return false;
    return true;
  });
  const res=document.getElementById('result');
  if(pool.length<2){ res.innerHTML=`<div class="daycard"><p class="help">Not enough spots for that combo — try “Anywhere” or a different vibe.</p></div>`; return; }
  // seed: nearest spot to you, or a random one; then greedy nearest-neighbour, cap 6
  // the first stop has to be open by the time you could reach it, too
  const seeds = dayState.openOnly
    ? pool.filter(p=>openInfo(p,new Date(Date.now()+(me?walkMin(me,p):0)*60000)).state!=='closed')
    : pool;
  if(!seeds.length){ res.innerHTML=`<div class="daycard"><p class="help">Everything in that combo is shut right now. Turn off “Only places open when I'd arrive”, or try another vibe.</p></div>`; return; }
  // near you: pick at random among the closest few, so Reroll still varies
  const near = me ? [...seeds].sort((a,b)=>haversine(me,a)-haversine(me,b)).slice(0,3) : null;
  const start = me
    ? near[Math.floor(Math.random()*near.length)]
    : seeds[Math.floor(Math.random()*seeds.length)];
  // walk the route on a clock so each stop is checked against when you'd actually arrive
  const now=new Date();
  let clock=new Date(now.getTime() + (me?walkMin(me,start):0)*60000);
  const route=[start], etas=[new Date(clock)];
  let remaining=pool.filter(p=>p!==start);
  while(route.length<6 && remaining.length){
    const last=route[route.length-1];
    remaining.sort((a,b)=>haversine(last,a)-haversine(last,b));
    // keep the day tight: stop if next jump is huge and we already have 3+
    if(route.length>=3 && haversine(last,remaining[0])>4.5) break;
    // take the nearest candidate that is still open when we'd get there
    let pick=null,pickEta=null;
    for(let i=0;i<Math.min(remaining.length,12);i++){
      const cand=remaining[i];
      if(route.length>=3 && haversine(last,cand)>4.5) break;
      const eta=new Date(clock.getTime()+(DWELL_MIN+walkMin(last,cand))*60000);
      if(!dayState.openOnly || openInfo(cand,eta).state!=='closed'){ pick=cand; pickEta=eta; break; }
    }
    if(!pick) break;
    route.push(pick); etas.push(pickEta);
    remaining=remaining.filter(p=>p!==pick);
    clock=pickEta;
  }
  let dist=0; for(let i=1;i<route.length;i++) dist+=haversine(route[i-1],route[i]);
  const toFirst = me ? haversine(me,route[0]) : 0;
  const stops=route.map(p=>`${p.lat},${p.lng}`);
  const origin = me ? `${me.lat},${me.lng}` : stops[0];
  const via = me ? stops.slice(0,-1) : stops.slice(1,-1);
  const routeUrl=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${stops[stops.length-1]}&travelmode=walking${via.length?`&waypoints=${via.join('|')}`:''}`;
  const title=`${VIBES[dayState.vibe].label} · ${me?'Near you':(dayState.area==='ALL'?'NYC':BOROS[dayState.area])}`;
  const opener = me
    ? `first stop is ${toFirst<1?`${Math.round(toFirst*1000)} m`:`${toFirst.toFixed(1)} km`} from you, in ${route[0].h}`
    : `starts in ${route[0].h}`;
  res.innerHTML=`<div class="daycard">
    <h2>${title}</h2>
    <p class="help">${route.length} stop${route.length!==1?'s':''} · about ${(dist+toFirst).toFixed(1)} km on foot · ${opener}.</p>
    ${route.map((p,i)=>{const v=CAT[p.c];const l=hoursLabel(p,etas[i]);
      return `<div class="stop"><div class="num" style="--c:${v.c}">${i+1}</div>
      <div class="info"><h4>${p.n}</h4><div class="meta">${v.e} ${v.label} · ${p.h}</div>
      <div class="etaline">~${clockTxt(etas[i])}${p.c==='arch'?'':` <span class="hb ${l.cls}">${l.txt}</span>`}</div>
      <p>${p.bl}</p></div></div>`;}).join('')}
    <div class="routebtns">
      <a class="btn" href="${routeUrl}" target="_blank" rel="noopener">Open route in Google Maps ↗</a>
      <button class="btn ghost" id="reroll">↻ Reroll</button>
      <button class="btn ghost" id="tomyday">✎ Send to My day</button>
    </div>
  </div>`;
  res.querySelector('#reroll').onclick=()=>planDay(!!me);
  res.querySelector('#tomyday').onclick=()=>{
    route.forEach(p=>{ if(!dayState.picks.some(x=>x.n===p.n)) dayState.picks.push(p); });
    renderMyDay();
    document.getElementById('mydaylist').scrollIntoView({behavior:'smooth',block:'center'});
  };
  res.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============ MUSTS: to-do list + split across days ============ */
const mustState={days:3};
const favSpots=()=>DATA.filter(p=>state.favs.has(p.n));

/* day 1 is today (or now, if it's already past 11), day 2 tomorrow, and so on,
   so the opening-hours check lands on the right weekday for each day out */
function dayStart(offset){
  const d=new Date(); d.setDate(d.getDate()+offset); d.setHours(11,0,0,0);
  const now=new Date();
  return (offset===0 && now>d) ? now : d;
}
const dayName=d=>d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});

/* One day's published schedule, for planning ahead rather than "right now". */
function daySched(p,dow){
  if(!p.hrs) return {k:'unknown',t:'—'};
  const s=p.hrs[dow];
  if(!s) return {k:'closed',t:'Closed'};
  if(s==='00:00-24:00') return {k:'open',t:'24h'};
  return {k:'open',t:s.split(',').map(r=>r.replace('-','–')).join(', ')};
}
/* the next Saturday / Sunday coming up (today counts if it already is that day) */
function nextDow(dow){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+((dow-d.getDay())+7)%7);
  return d;
}
const shortDate=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'});

/* k-means on lat/lng, then a capped reassignment so no single day gets everything */
function clusterDays(spots,k){
  k=Math.max(1,Math.min(k,spots.length));
  if(k===1) return [spots.slice()];
  const cent=[{lat:spots[0].lat,lng:spots[0].lng}];
  while(cent.length<k){                    // farthest-point seeding = stable, spread-out starts
    let best=spots[0],bd=-1;
    spots.forEach(p=>{const d=Math.min(...cent.map(c=>haversine(c,p))); if(d>bd){bd=d;best=p;}});
    cent.push({lat:best.lat,lng:best.lng});
  }
  for(let it=0;it<30;it++){
    const g=cent.map(()=>[]);
    spots.forEach(p=>{let bi=0,bd=Infinity;cent.forEach((c,i)=>{const d=haversine(c,p);if(d<bd){bd=d;bi=i;}});g[bi].push(p);});
    let moved=false;
    g.forEach((grp,i)=>{
      if(!grp.length) return;
      const la=grp.reduce((s,p)=>s+p.lat,0)/grp.length, ln=grp.reduce((s,p)=>s+p.lng,0)/grp.length;
      if(Math.abs(la-cent[i].lat)>1e-7||Math.abs(ln-cent[i].lng)>1e-7) moved=true;
      cent[i]={lat:la,lng:ln};
    });
    if(!moved) break;
  }
  // Loose balancing only. A tight cap would force far-apart spots into one day just to
  // even out the counts, so we allow a natural big cluster (all of downtown, say) and
  // only stop any single day from swallowing everything.
  const cap=Math.max(3,Math.ceil(spots.length/k*1.6)), pairs=[], groups=cent.map(()=>[]), taken=new Set();
  spots.forEach((p,pi)=>cent.forEach((c,ci)=>pairs.push([haversine(c,p),pi,ci])));
  pairs.sort((a,b)=>a[0]-b[0]);
  for(const[,pi,ci]of pairs){ if(taken.has(pi)||groups[ci].length>=cap) continue; groups[ci].push(spots[pi]); taken.add(pi); }
  spots.forEach((p,pi)=>{ if(taken.has(pi))return; let bi=0; groups.forEach((g,i)=>{if(g.length<groups[bi].length)bi=i;}); groups[bi].push(p); taken.add(pi); });
  return groups.filter(g=>g.length).sort((a,b)=>b.length-a.length);
}

/* order one day's stops on the clock, preferring whatever is open when you'd arrive */
function orderDay(list,startAt){
  const rest=list.slice(), out=[];
  let clock=new Date(startAt), cur=rest.reduce((a,b)=>a,rest[0]);
  // start from the most "cornered" stop so the walk doesn't double back
  const cx=list.reduce((s,p)=>s+p.lat,0)/list.length, cy=list.reduce((s,p)=>s+p.lng,0)/list.length;
  cur=rest.reduce((a,b)=>haversine({lat:cx,lng:cy},b)>haversine({lat:cx,lng:cy},a)?b:a);
  rest.splice(rest.indexOf(cur),1);
  out.push({p:cur,eta:new Date(clock)});
  while(rest.length){
    rest.sort((a,b)=>haversine(cur,a)-haversine(cur,b));
    const etaOf=p=>new Date(clock.getTime()+(DWELL_MIN+walkMin(cur,p))*60000);
    const openOne=rest.find(p=>p.c==='arch'||openInfo(p,etaOf(p)).state!=='closed');
    const next=openOne||rest[0];
    clock=etaOf(next);
    out.push({p:next,eta:new Date(clock)});
    rest.splice(rest.indexOf(next),1);
    cur=next;
  }
  return out;
}

function buildMustsUI(){
  const mp=document.getElementById('mustsPanel'); if(!mp) return;
  const all=favSpots(), pending=all.filter(p=>!state.done.has(p.n)), done=all.filter(p=>state.done.has(p.n));
  if(!all.length){
    mp.innerHTML=`<div class="daycard"><h2>✅ Musts</h2>
      <p class="help">No musts yet. Tap the ♡ on any card in the <b>List</b> tab and it lands here — saved on this device.</p></div>`;
    return;
  }
  const row=p=>{const v=CAT[p.c]||{c:'#999',e:'📍',label:'—'}, isDone=state.done.has(p.n),
    l=p.c==='arch'?null:hoursLabel(p,new Date());
    return `<div class="todo ${isDone?'is-done':''}">
      <button class="chk ${isDone?'on':''}" data-done="${esc(p.n)}" aria-label="Mark ${esc(p.n)} done">${isDone?'✓':''}</button>
      <div class="info"><h4>${esc(p.n)}</h4>
        <div class="meta"><span class="mt">${v.e} ${esc(p.h)}</span>${l?`<span class="hb ${l.cls}">${l.txt}</span>`:''}</div></div>
      <a class="tgo" href="${gmap(p)}" target="_blank" rel="noopener" aria-label="Directions to ${esc(p.n)}">↗</a>
      <button class="del" data-unfav="${esc(p.n)}" aria-label="Remove ${esc(p.n)} from musts">♥</button></div>`;};

  mp.innerHTML=`
    <div class="daycard">
      <h2>✅ Musts &nbsp;<span class="tally">${done.length}/${all.length} done</span></h2>
      <p class="help">Everything you've hearted. Tick one off when you've done it — the list and the ticks stay on this device.</p>
      <div class="routebtns" style="margin-top:2px">
        <button class="btn" id="mustsOnMap">🗺 Show musts on the map</button>
        ${done.length?`<button class="btn ghost" id="clearDone">↺ Untick all</button>`:''}
      </div>
      <label class="fld">To do — ${pending.length} left</label>
      ${pending.length?`<div class="todolist">${pending.map(row).join('')}</div>`:'<p class="help">All done. 🎉</p>'}
      ${done.length?`<label class="fld">Done</label><div class="todolist">${done.map(row).join('')}</div>`:''}
    </div>
    ${weekendCard(pending)}
    <div class="daycard">
      <h2>🗓 Split them across my days</h2>
      <p class="help">How many days are left? We'll group the ${pending.length} pending must${pending.length!==1?'s':''} by area — one walkable cluster per day, each ordered around its opening hours.</p>
      <label class="fld">Days left</label>
      <div class="pillrow" id="dayCount">${[1,2,3,4,5,6,7].map(n=>`<button class="pill ${n===mustState.days?'on':''}" data-d="${n}">${n}</button>`).join('')}</div>
      <button class="go" id="splitDays">Plan my ${mustState.days} day${mustState.days!==1?'s':''} →</button>
      <div id="daysOut"></div>
    </div>`;

  mp.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ toggleDone(b.dataset.done); buildMustsUI(); drawList(); drawMarkers(); });
  mp.querySelectorAll('[data-unfav]').forEach(b=>b.onclick=()=>{ toggleFav(b.dataset.unfav); buildMustsUI(); drawList(); drawMarkers(); });
  mp.querySelectorAll('#dayCount .pill').forEach(b=>b.onclick=()=>{
    mustState.days=+b.dataset.d;
    mp.querySelectorAll('#dayCount .pill').forEach(x=>x.classList.toggle('on',x===b));
    mp.querySelector('#splitDays').textContent=`Plan my ${mustState.days} day${mustState.days!==1?'s':''} →`;
  });
  mp.querySelector('#splitDays').onclick=splitDays;
  mp.querySelector('#mustsOnMap').onclick=()=>{
    state.onlyFavs=true; favBtn.classList.add('on');
    document.querySelector('.tab[data-tab="map"]').click();
    render();
  };
  const cd=mp.querySelector('#clearDone');
  if(cd) cd.onclick=()=>{ state.done.clear(); saveSet(LS_DONE,state.done); buildMustsUI(); drawList(); };
}

/* Weekend at a glance: what's open Saturday and Sunday, and — the one that bites —
   which musts are weekday-only and have to be done before Friday closes. */
function weekendCard(pending){
  const spots=pending.filter(p=>p.c!=='arch');
  const buildings=pending.filter(p=>p.c==='arch');
  if(!spots.length) return '';
  const sat=nextDow(6), sun=nextDow(0);
  const shutSat=spots.filter(p=>daySched(p,6).k==='closed');
  const shutSun=spots.filter(p=>daySched(p,0).k==='closed');
  const weekdayOnly=spots.filter(p=>daySched(p,6).k==='closed'&&daySched(p,0).k==='closed');
  const cell=(p,dow)=>{const s=daySched(p,dow);
    return `<div class="wkd ${s.k}"><b>${dow===6?'Sat':'Sun'}</b> ${s.t}</div>`;};
  return `<div class="daycard">
    <h2>🗓 The weekend ahead</h2>
    <p class="help">Published hours for Sat ${shortDate(sat)} and Sun ${shortDate(sun)}, so you can slot things in before you go.
      ${shutSat.length||shutSun.length?`<b>${shutSat.length} shut Saturday, ${shutSun.length} shut Sunday.</b>`:'Everything pending is open both days.'}</p>
    ${weekdayOnly.length?`<div class="warn"><b>Weekdays only — do these before Friday closes:</b> ${weekdayOnly.map(p=>esc(p.n)).join(' · ')}</div>`:''}
    <div class="todolist">
      ${spots.map(p=>`<div class="wkrow">
        <div class="wkn">${esc(p.n)} <span class="wkh">${esc(p.h)}</span></div>
        <div class="wkdays">${cell(p,6)}${cell(p,0)}</div></div>`).join('')}
    </div>
    ${buildings.length?`<p class="help" style="margin-top:10px">${buildings.length} of your musts ${buildings.length===1?'is a building':'are buildings'} — no fixed hours here: ${buildings.map(p=>esc(p.n)).join(' · ')}.</p>`:''}
  </div>`;
}

function splitDays(){
  const out=document.getElementById('daysOut');
  const pending=favSpots().filter(p=>!state.done.has(p.n));
  if(!pending.length){ out.innerHTML=`<div class="daycard"><p class="help">Nothing pending — everything's ticked off.</p></div>`; return; }
  const groups=clusterDays(pending,mustState.days);
  out.innerHTML=groups.map((g,i)=>{
    const stops=orderDay(g,dayStart(i));
    let km=0; for(let j=1;j<stops.length;j++) km+=haversine(stops[j-1].p,stops[j].p);
    const wp=stops.map(s=>`${s.p.lat},${s.p.lng}`);
    const multiBoro=new Set(g.map(p=>p.b)).size>1;
    const transit=multiBoro||km>8;            // too spread out to walk — send Maps to transit instead
    const legs=multiBoro?' end to end — spread across boroughs, so plan on the subway'
              :transit?' end to end — a long chain, expect a subway hop or two':' on foot';
    const url=`https://www.google.com/maps/dir/?api=1&origin=${wp[0]}&destination=${wp[wp.length-1]}&travelmode=${transit?'transit':'walking'}${wp.length>2?`&waypoints=${wp.slice(1,-1).join('|')}`:''}`;
    const shut=stops.filter(s=>s.p.c!=='arch'&&openInfo(s.p,s.eta).state==='closed').length;
    const areas=[...new Set(g.map(p=>p.h))].slice(0,3).join(' · ');
    return `<div class="daycard">
      <h2>Day ${i+1} — ${areas}</h2>
      <p class="help">${dayName(dayStart(i))} · ${stops.length} stop${stops.length!==1?'s':''} · ${km.toFixed(1)} km${legs}.${shut?` <b style="color:#FF7A72">${shut} would be shut at that time — shift it to another day.</b>`:''}</p>
      ${stops.map((s,j)=>{const v=CAT[s.p.c]||{c:'#999',e:'📍',label:'—'};const l=hoursLabel(s.p,s.eta);
        return `<div class="stop"><div class="num" style="--c:${v.c}">${j+1}</div>
          <div class="info"><h4>${esc(s.p.n)}</h4><div class="meta">${v.e} ${v.label} · ${esc(s.p.h)}</div>
          <div class="etaline">~${clockTxt(s.eta)}${s.p.c==='arch'?'':` <span class="hb ${l.cls}">${l.txt}</span>`}</div></div></div>`;}).join('')}
      <div class="routebtns"><a class="btn" href="${url}" target="_blank" rel="noopener">Open day ${i+1} in Google Maps ↗</a></div>
    </div>`;
  }).join('');
  out.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============ ADD A SPOT ============ */
function buildAddUI(){
  const ap=document.getElementById('addPanel');
  const catOpts=Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v.e} ${v.label}</option>`).join('');
  const boroOpts=Object.entries(BOROS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  ap.innerHTML=`
    <div class="daycard">
      <h2>➕ Add a spot</h2>
      <p class="help">Save your own places with a category. They stay on this device and mix into the map, list & day trips.</p>
      <label class="fld">Name</label><input class="inp" id="f_name" placeholder="e.g. New York Old Iron">
      <label class="fld">Category</label><select class="inp" id="f_cat">${catOpts}</select>
      <label class="fld">Borough</label><select class="inp" id="f_boro">${boroOpts}</select>
      <label class="fld">Neighborhood <span class="opt">optional</span></label><input class="inp" id="f_hood" placeholder="e.g. Bushwick">
      <label class="fld">Address <span class="opt">we'll locate it on the map</span></label><input class="inp" id="f_addr" placeholder="123 Example St, Brooklyn">
      <label class="fld">Or coordinates <span class="opt">lat, lng — optional, overrides address</span></label><input class="inp" id="f_ll" placeholder="40.7181, -73.9904">
      <label class="fld">Note <span class="opt">optional</span></label><input class="inp" id="f_note" placeholder="Why it's worth it">
      <button class="go" id="f_save">Save spot →</button>
      <div id="f_msg" class="fmsg"></div>
    </div>
    <div class="daycard" id="yourspots"></div>`;
  ap.querySelector('#f_save').onclick=addSpot;
  renderYourSpots();
}
async function addSpot(){
  const g=id=>document.getElementById(id), msg=g('f_msg');
  const name=g('f_name').value.trim();
  if(!name){ msg.textContent='Add a name first.'; return; }
  const cat=g('f_cat').value, boro=g('f_boro').value;
  const hood=g('f_hood').value.trim()||BOROS[boro];
  const addr=g('f_addr').value.trim(), ll=g('f_ll').value.trim();
  const note=g('f_note').value.trim()||'Added by you.';
  let lat=null,lng=null;
  if(ll){
    const m=ll.split(',').map(s=>parseFloat(s.trim()));
    if(m.length===2 && !isNaN(m[0]) && !isNaN(m[1])){ lat=m[0]; lng=m[1]; }
    else { msg.textContent='Coordinates look off — use e.g. 40.72, -73.99'; return; }
  }
  if(lat===null){
    if(!addr){ msg.textContent='Add an address, or paste coordinates.'; return; }
    msg.textContent='Finding location…';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(addr+', New York'));
      const j=await r.json();
      if(!j.length){ msg.textContent="Couldn't find that address — add the borough, or paste coordinates."; return; }
      lat=parseFloat(j[0].lat); lng=parseFloat(j[0].lon);
    }catch(e){ msg.textContent='Lookup failed (no connection?). Paste coordinates instead.'; return; }
  }
  userP.push({n:name,c:cat,h:hood,b:boro,lat,lng,a:(addr||`${lat.toFixed(4)}, ${lng.toFixed(4)}`),bl:note,user:true});
  saveUser(); rebuild(); render();
  ['f_name','f_hood','f_addr','f_ll','f_note'].forEach(id=>g(id).value='');
  renderYourSpots();
  msg.textContent='✓ Saved — find "'+name+'" in the List or on the Map.';
}
function renderYourSpots(){
  const box=document.getElementById('yourspots'); if(!box) return;
  if(!userP.length){ box.innerHTML='<h2>Your spots</h2><p class="help">Nothing added yet. What you add shows here with a delete button.</p>'; return; }
  box.innerHTML='<h2>Your spots ('+userP.length+')</h2>'+userP.map((p,i)=>{
    const v=CAT[p.c]||{c:'#999',e:'📍',label:'—'};
    return `<div class="stop"><div class="num" style="--c:${v.c}">${v.e}</div>
      <div class="info"><h4>${esc(p.n)}</h4><div class="meta">${v.label} · ${esc(p.h)}, ${BOROS[p.b]||''}</div></div>
      <button class="del" data-i="${i}" aria-label="Delete ${esc(p.n)}">✕</button></div>`;
  }).join('')+'<div class="routebtns"><button class="btn ghost" id="expspots">⬇︎ Export my spots (JSON)</button></div>';
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ userP.splice(+b.dataset.i,1); saveUser(); rebuild(); render(); renderYourSpots(); });
  const e=box.querySelector('#expspots'); if(e) e.onclick=exportSpots;
}
function exportSpots(){
  try{
    const blob=new Blob([JSON.stringify(userP,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='my-nyc-spots.json'; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){}
}

buildDayUI();
buildAddUI();
buildMustsUI();
render();

[120,400,900,1600].forEach(t=>setTimeout(resizeMap,t));
window.addEventListener('load',resizeMap);
window.addEventListener('resize',resizeMap);
window.addEventListener('orientationchange',()=>setTimeout(resizeMap,250));
